apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: financial-cockpit-web-test
  labels:
    app: financial-cockpit-web
    env: test
    tier: web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: cloudrun-sa@fintech-data-hub-45513.iam.gserviceaccount.com
      timeoutSeconds: 300
      containerConcurrency: 80
      containers:
      - image: financial-cockpit-web
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: fintech-data-hub-45513
        - name: GCP_PROJECT
          value: fintech-data-hub-45513
        - name: FIRESTORE_DATABASE
          value: fintech-data-hub-fs
        - name: GOOGLE_CLOUD_LOCATION
          value: europe-west1
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: GEMINI_MODEL
          value: gemini-3.6-flash
        - name: MODEL
          value: gemini-3.6-flash
        - name: ETORO_ACCOUNT_MODE
          value: demo
        - name: ETORO_CLIENT_URL
          value: https://financial-etoro-service-test-1051515255476.europe-west1.run.app
