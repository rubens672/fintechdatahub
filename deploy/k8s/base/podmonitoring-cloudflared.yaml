apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: cloudflared-monitoring
  namespace: fintech-platform
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: fintech-platform
spec:
  selector:
    matchLabels:
      app: cloudflared
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    timeout: 10s
