# ==============================================================================
# cronjobs.yaml — Job Pianificati Nativi di Kubernetes (100% Interni al Cluster)
# ==============================================================================
# Sostituiscono interamente Google Cloud Scheduler:
# - Zero uscita su Internet e zero passaggio da Cloudflare
# - Chiamate dirette via CoreDNS interno a latenza zero
# - Container ultraleggero curlimages/curl & bitnami/kubectl con rightsizing
# - 100% Spot VM allocation (nodeSelector & toleration su ogni pod)
# - Schedule differenziato:
#   * Portale Web (financial-user-web + cloudflared): 09:00 - 22:30 IT ogni giorno
#   * Motori Trading (etoro, mcp, edgar, harvest, agent): 09:00 - 16:30 NY Lun-Ven
#   * Spegnimento Notturno Totale (22:30 - 09:00 IT ogni giorno): 0 Pod = 0,00 €
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Opening Shield Widen (09:10 NY / 15:10 IT — 20 min prima della campana)
# ------------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etoro-opening-shield-widen
  namespace: fintech-platform
  labels:
    app.kubernetes.io/part-of: fintech-platform
spec:
  schedule: "10 9 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
          restartPolicy: OnFailure
          containers:
          - name: trigger
            image: curlimages/curl:8.5.0
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "50m"
                memory: "64Mi"
            args:
            - -s
            - -S
            - -X
            - POST
            - "http://financial-etoro-service.fintech-platform.svc.cluster.local:8080/api/scheduler/opening-shield?action=widen&account=demo"
---
