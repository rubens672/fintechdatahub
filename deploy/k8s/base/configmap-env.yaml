apiVersion: v1
kind: ConfigMap
metadata:
  name: fintech-platform-env
  namespace: fintech-platform
data:
  GOOGLE_CLOUD_PROJECT: "fintech-data-hub-45513"
  GCP_PROJECT: "fintech-data-hub-45513"
  FIRESTORE_DATABASE: "fintech-data-hub-fs"
  GOOGLE_CLOUD_LOCATION: "europe-west1"
  VERTEX_LOCATION: "us-central1"
