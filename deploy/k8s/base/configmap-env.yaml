  EDGAR_APP_URL: "http://financial-edgar-app.fintech-platform.svc.cluster.local:8080"
  ALPHA_HARVEST_URL: "http://alpha-harvest-agent.fintech-platform.svc.cluster.local:8080"
  QUANT_AGENT_URL: "http://eodhd-agent.fintech-platform.svc.cluster.local:8080"
  MCP_SERVER_URL: "http://financial-mcp-server.fintech-platform.svc.cluster.local:8080"
