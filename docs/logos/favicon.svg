<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fdhGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Candlesticks in Background -->
  <line x1="25" y1="16" x2="25" y2="38" stroke="#10b981" stroke-width="1" stroke-opacity="0.7" />
  <rect x="23" y="20" width="4" height="12" rx="1" fill="#10b981" fill-opacity="0.85" />
  
  <line x1="39" y1="12" x2="39" y2="34" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7" />
  <rect x="37" y="15" width="4" height="13" rx="1" fill="#00f0ff" fill-opacity="0.9" />

  <!-- Breakout Trend Arrow -->
  <path d="M 12 39 L 25 30 L 33 34 L 49 15" fill="none" stroke="#00f0ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="52,13 44,14 49,20" fill="#00f0ff" filter="url(#glow)" />

  <!-- Stylized Monogram FDH -->
  <text x="32" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5" fill="url(#fdhGlow)" text-anchor="middle" filter="url(#glow)">FDH</text>
</svg>