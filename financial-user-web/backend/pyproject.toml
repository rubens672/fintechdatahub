[project]
name = "financial-user-backend"
version = "1.0.0"
description = "FastAPI Read-Only Backend Bridge for Financial User WebApp & GCP Cloud Run"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "yfinance>=0.2.40",
    "google-cloud-firestore>=2.19.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
