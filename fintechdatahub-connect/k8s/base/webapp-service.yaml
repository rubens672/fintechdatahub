apiVersion: v1
kind: Service
metadata:
  name: fintechdatahub-connect-webapp-service
  labels:
    app: fintechdatahub-connect-webapp
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: fintechdatahub-connect-webapp