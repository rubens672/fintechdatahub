apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: staging-
resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: webapp-configmap
    patch: |-
      - op: replace
        path: /data/REST_SERVICE_URL
        value: "http://staging-fintechdatahub-connect-rest-service:8081/api/v1/data"


