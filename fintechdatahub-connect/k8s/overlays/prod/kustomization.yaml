apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa-webapp.yaml

patches:
  - target:
      kind: Deployment
      name: fintechdatahub-connect-rest-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: fintechdatahub-connect-webapp-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
