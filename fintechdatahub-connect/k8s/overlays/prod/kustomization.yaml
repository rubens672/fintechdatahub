apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-
resources:
  - ../../base
  - hpa-webapp.yaml

patches:
  - target:
      kind: ConfigMap
      name: webapp-configmap
    patch: |-
      - op: replace
        path: /data/REST_SERVICE_URL
        value: "http://prod-fintechdatahub-connect-rest-service:8081/api/v1/data"
  - target:
      kind: Deployment
      name: fintechdatahub-connect-rest-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: fintechdatahub-connect-webapp-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

