apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-
resources:
  - ../../base
  - hpa-webapp.yaml

patches:
  - target:
      kind: Service
      name: fintechdatahub-connect-webapp-service
    patch: |-
      - op: replace
        path: /metadata/annotations/cloud.google.com~1backend-config
        value: '{"ports": {"8080": "prod-fintechdatahub-connect-webapp-backendconfig"}}'
  - target:
      kind: Deployment
      name: fintechdatahub-connect-rest-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: fintechdatahub-connect-webapp-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

