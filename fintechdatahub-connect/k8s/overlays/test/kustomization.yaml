apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: test-
resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: fintechdatahub-connect-webapp-service
    patch: |-
      - op: replace
        path: /metadata/annotations/cloud.google.com~1backend-config
        value: '{"ports": {"8080": "test-fintechdatahub-connect-webapp-backendconfig"}}'


