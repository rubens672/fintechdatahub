[project]
name = "financial-chainlit-app"
version = "0.1.0"
description = "Financial AI Assistant & Copilot powered by Chainlit, Google ADK and Custom Financial MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=1.3.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "google-cloud-logging>=3.0.0",
    "google-adk>=2.6.0",
    "mcp>=1.0.0",
    "yfinance>=0.2.40",
    "feedparser>=6.0.10",
    "google-cloud-firestore>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renderers"]
